<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bežecká Výzva: Fiľakovo -> Tokio</title>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Tailwind CSS & Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; background-color: #050814; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .glass-panel { background: rgba(13, 19, 38, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 3px; }
    </style>
</head>
<body class="select-none">

    <div id="canvas-container"></div>

    <div class="relative z-10 flex flex-col md:flex-row h-screen justify-between p-4 md:p-6 pointer-events-none">
        
        <!-- Left Panel: Stats & Milestones -->
        <div class="w-full md:w-96 flex flex-col gap-4 pointer-events-auto max-h-full overflow-hidden">
            <div class="glass-panel p-5 shadow-2xl">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold uppercase tracking-widest text-red-400 flex items-center gap-1">
                        <i class="fa-solid fa-location-dot"></i> Štart: Fiľakovo
                    </span>
                    <span class="text-xs text-gray-400">Cieľ: Tokio (9,100 km)</span>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white mb-1">Cesta do Tokia 🏃‍♂️</h1>
                <p class="text-xs text-gray-300 mb-4">Spoločný pokrok všetkých bežcov v reálnom čase.</p>

                <div class="space-y-2">
                    <div class="flex justify-between text-sm font-semibold">
                        <span id="total-km" class="text-xl font-extrabold text-amber-400">0.0 km</span>
                        <span id="progress-percent" class="text-xl font-extrabold text-red-500">0.0%</span>
                    </div>
                    <div class="w-full bg-gray-800 rounded-full h-3 overflow-hidden p-0.5 border border-gray-700">
                        <div id="progress-bar" class="bg-gradient-to-r from-red-600 via-amber-500 to-yellow-400 h-2 rounded-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-400 pt-1">
                        <span>Zostáva: <strong id="remaining-km" class="text-gray-200">9 100 km</strong></span>
                        <span id="runner-count">0 behov</span>
                    </div>
                </div>
            </div>

            <!-- Milestones -->
            <div class="glass-panel p-4 flex-1 flex flex-col min-h-0">
                <h2 class="text-xs font-bold uppercase tracking-wider text-gray-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-map-pin text-red-400"></i> Zastávky na trase (Street View)
                </h2>
                <div id="milestones-list" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
            </div>
        </div>

        <!-- Right Panel: Form & Tabs -->
        <div class="w-full md:w-96 flex flex-col gap-4 pointer-events-auto mt-4 md:mt-0 max-h-full overflow-hidden">
            <div class="glass-panel p-5 shadow-2xl flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-gray-300 flex items-center gap-2">
                        <i class="fa-solid fa-plus-circle text-amber-400"></i> Pridať beh
                    </h2>
                    <button id="admin-toggle" onclick="toggleAdminPrompt()" class="text-xs px-2.5 py-1 rounded bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-600 transition flex items-center gap-1">
                        <i class="fa-solid fa-lock text-amber-400"></i> <span id="admin-btn-text">Admin</span>
                    </button>
                </div>

                <form id="run-form" class="space-y-3">
                    <div>
                        <input type="text" id="runner-name" placeholder="Meno bežca" required class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="number" step="0.1" id="run-km" placeholder="Vzdialenosť (km)" required class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                        <input type="date" id="run-date" required class="w-full bg-gray-900/80 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-400">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-red-600 to-amber-500 hover:from-red-500 hover:to-amber-400 text-white font-bold py-2.5 px-4 rounded-lg shadow-lg text-sm transition">
                        Odoslať km do výzvy
                    </button>
                </form>
            </div>

            <!-- Tabs: Leaderboard & Feed -->
            <div class="glass-panel p-4 flex-1 flex flex-col min-h-0">
                <div class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                    <div class="flex gap-3">
                        <button id="tab-leaderboard-btn" onclick="switchTab('leaderboard')" class="text-xs font-bold uppercase tracking-wider text-amber-400 border-b-2 border-amber-400 pb-1">
                            🏆 Rebríček
                        </button>
                        <button id="tab-feed-btn" onclick="switchTab('feed')" class="text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-gray-200 pb-1">
                            📋 Posledné behy
                        </button>
                    </div>
                    <span id="admin-indicator" class="hidden text-[10px] bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2 py-0.5 rounded font-bold">SPRÁVCA</span>
                </div>

                <div id="tab-leaderboard" class="space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
                <div id="tab-feed" class="hidden space-y-2 overflow-y-auto custom-scrollbar flex-1 pr-1"></div>
            </div>
        </div>
    </div>

    <script>
        const ROUTE_POINTS = [
            { name: "Fiľakovo (Štart)", lat: 48.2674, lng: 19.8247, targetKm: 0 },
            { name: "Istanbul", lat: 41.0082, lng: 28.9784, targetKm: 1450 },
            { name: "Taškent", lat: 41.2995, lng: 69.2401, targetKm: 4800 },
            { name: "Peking", lat: 39.9042, lng: 116.4074, targetKm: 7800 },
            { name: "Tokio (Cieľ)", lat: 35.6762, lng: 139.6503, targetKm: 9100 }
        ];
        const TOTAL_DISTANCE = 9100;
        const ADMIN_PIN = "1234"; // Váš PIN pre správcu
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbynrt9fpq1a0LzplHb1e9BmcmmV_PNaC6wbQhM9T-0J8z5N-7A73yI9EJzhA5tgf3jQ/exec";

        let runsArray = [];
        let isAdmin = false;
        let activeTab = 'leaderboard';

        document.getElementById('run-date').valueAsDate = new Date();

        // 1. NAČÍTANIE DÁT Z GOOGLE SHEETS (doGet)
        function fetchRuns() {
            fetch(SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    runsArray = data;
                    updateUI();
                })
                .catch(err => console.error("Chyba pri načítaní z Google Sheets:", err));
        }

        // Automatické obnavovanie každých 10 sekúnd
        setInterval(fetchRuns, 10000);
        fetchRuns();

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tab-leaderboard').classList.toggle('hidden', tab !== 'leaderboard');
            document.getElementById('tab-feed').classList.toggle('hidden', tab !== 'feed');
            
            document.getElementById('tab-leaderboard-btn').className = tab === 'leaderboard' 
                ? 'text-xs font-bold uppercase tracking-wider text-amber-400 border-b-2 border-amber-400 pb-1' 
                : 'text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-gray-200 pb-1';
                
            document.getElementById('tab-feed-btn').className = tab === 'feed' 
                ? 'text-xs font-bold uppercase tracking-wider text-amber-400 border-b-2 border-amber-400 pb-1' 
                : 'text-xs font-bold uppercase tracking-wider text-gray-400 hover:text-gray-200 pb-1';
        }

        function toggleAdminPrompt() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('admin-btn-text').innerText = 'Admin';
                document.getElementById('admin-indicator').classList.add('hidden');
                updateUI();
            } else {
                const pin = prompt('Zadajte heslo/PIN správcu:');
                if (pin === ADMIN_PIN) {
                    isAdmin = true;
                    document.getElementById('admin-btn-text').innerText = 'Odhlásiť';
                    document.getElementById('admin-indicator').classList.remove('hidden');
                    updateUI();
                } else if (pin !== null) {
                    alert('Nesprávny PIN kód!');
                }
            }
        }

        function updateUI() {
            const totalKm = runsArray.reduce((acc, r) => acc + parseFloat(r.km || 0), 0);
            const progress = Math.min(100, (totalKm / TOTAL_DISTANCE) * 100);

            document.getElementById('total-km').innerText = totalKm.toFixed(1) + ' km';
            document.getElementById('progress-percent').innerText = progress.toFixed(1) + '%';
            document.getElementById('progress-bar').style.width = progress + '%';
            document.getElementById('remaining-km').innerText = Math.max(0, TOTAL_DISTANCE - totalKm).toFixed(1) + ' km';
            document.getElementById('runner-count').innerText = runsArray.length + ' behov';

            // Milestones
            const milestonesContainer = document.getElementById('milestones-list');
            milestonesContainer.innerHTML = '';
            ROUTE_POINTS.forEach(m => {
                const reached = totalKm >= m.targetKm;
                const svUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${m.lat},${m.lng}`;
                
                milestonesContainer.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-lg ${reached ? 'bg-amber-500/10 border border-amber-500/30' : 'bg-gray-900/40 border border-gray-800'}">
                        <div>
                            <div class="text-xs font-bold ${reached ? 'text-amber-400' : 'text-gray-300'}">${m.name}</div>
                            <div class="text-[10px] text-gray-400">${m.targetKm} km</div>
                        </div>
                        <a href="${svUrl}" target="_blank" class="text-xs px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 text-blue-400 hover:text-blue-300 border border-gray-700 transition flex items-center gap-1">
                            <i class="fa-solid fa-street-view"></i> Street View
                        </a>
                    </div>
                `;
            });

            // Rebríček bežcov
            const leaderboard = {};
            runsArray.forEach(r => {
                const name = r.name ? r.name.trim() : 'Neznámy Bežec';
                leaderboard[name] = (leaderboard[name] || 0) + parseFloat(r.km || 0);
            });

            const sortedLeaderboard = Object.entries(leaderboard).sort((a, b) => b[1] - a[1]);

            const leaderboardContainer = document.getElementById('tab-leaderboard');
            leaderboardContainer.innerHTML = sortedLeaderboard.length === 0 ? '<div class="text-xs text-gray-500 text-center py-4">Zatiaľ žiadni bežci v rebríčku.</div>' : '';

            sortedLeaderboard.forEach(([name, km], index) => {
                let badge = `<span class="w-5 text-center text-gray-500 font-bold">${index + 1}.</span>`;
                if (index === 0) badge = '<span class="text-lg">🥇</span>';
                if (index === 1) badge = '<span class="text-lg">🥈</span>';
                if (index === 2) badge = '<span class="text-lg">🥉</span>';

                leaderboardContainer.innerHTML += `
                    <div class="p-2.5 rounded-lg bg-gray-900/60 border border-gray-800 flex justify-between items-center text-xs">
                        <div class="flex items-center gap-2">
                            ${badge}
                            <span class="font-bold text-gray-100">${name}</span>
                        </div>
                        <span class="font-black text-amber-400">${km.toFixed(1)} km</span>
                    </div>
                `;
            });

            // Feed behov
            const feedContainer = document.getElementById('tab-feed');
            feedContainer.innerHTML = runsArray.length === 0 ? '<div class="text-xs text-gray-500 text-center py-4">Zatiaľ žiadne pridané behy.</div>' : '';
            
            runsArray.slice().reverse().forEach((run) => {
                feedContainer.innerHTML += `
                    <div class="p-2.5 rounded-lg bg-gray-900/50 border border-gray-800 flex justify-between items-center text-xs">
                        <div>
                            <span class="font-bold text-gray-200">${run.name}</span>
                            <span class="text-gray-400 ml-2">${run.date}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-bold text-amber-400">${parseFloat(run.km).toFixed(1)} km</span>
                            ${isAdmin ? `
                                <button onclick="deleteRun(${run.id})" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
                            ` : ''}
                        </div>
                    </div>
                `;
            });

            if (window.updateRunnerPosition) {
                window.updateRunnerPosition(totalKm);
            }
        }

        // 2. ODOSLANIE DÁT DO GOOGLE SHEETS (doPost)
        document.getElementById('run-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('runner-name').value;
            const km = parseFloat(document.getElementById('run-km').value);
            const date = document.getElementById('run-date').value;

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Odosielam...";

            if (name && km > 0) {
                fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "add",
                        name: name,
                        km: km,
                        date: date
                    })
                })
                .then(() => {
                    document.getElementById('run-km').value = '';
                    btn.disabled = false;
                    btn.innerText = "Odoslať km do výzvy";
                    fetchRuns();
                })
                .catch(() => {
                    document.getElementById('run-km').value = '';
                    btn.disabled = false;
                    btn.innerText = "Odoslať km do výzvy";
                    setTimeout(fetchRuns, 1500);
                });
            }
        });

        function deleteRun(rowId) {
            if (confirm('Naozaj chcete vymazať tento beh z Google Tabuľky?')) {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'delete', rowId: rowId })
                })
                .then(() => {
                    fetchRuns();
                })
                .catch(() => {
                    setTimeout(fetchRuns, 1500);
                });
            }
        }

        // --- THREE.JS GLOBE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 250);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        const globeGeo = new THREE.SphereGeometry(60, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const globeMat = new THREE.MeshPhongMaterial({
            map: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            bumpMap: textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
            bumpScale: 0.5,
            specular: new THREE.Color(0x333333),
            shininess: 5
        });
        const globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        const runnerGeo = new THREE.SphereGeometry(1.5, 16, 16);
        const runnerMat = new THREE.MeshBasicMaterial({ color: 0xff3300 });
        const runnerMarker = new THREE.Mesh(runnerGeo, runnerMat);
        scene.add(runnerMarker);

        window.updateRunnerPosition = function(totalKm) {
            const ratio = Math.min(1, totalKm / TOTAL_DISTANCE);
            const start = ROUTE_POINTS[0];
            const end = ROUTE_POINTS[ROUTE_POINTS.length - 1];
            
            const currentLat = start.lat + (end.lat - start.lat) * ratio;
            const currentLng = start.lng + (end.lng - start.lng) * ratio;
            
            const pos = latLngToVector3(currentLat, currentLng, 61);
            runnerMarker.position.copy(pos);
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
